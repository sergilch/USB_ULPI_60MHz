<text x="260.0" y="250.0" font-size="11" text-anchor="middle">|vd| &gt; 105 mV ref (DDA)</text>
<rect x="420" y="200" width="150" height="70" rx="6" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.8"/>
