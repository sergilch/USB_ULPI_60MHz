<text x="695.0" y="244.0" font-size="11" text-anchor="middle">bridge 3 ns, on 6 ns,</text>
<text x="695.0" y="257.0" font-size="11" text-anchor="middle">off 10 ns, SR latch</text>
<rect x="170" y="300" width="180" height="70" rx="6" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="260.0" y="335.0" font-size="13.5" font-weight="bold" text-anchor="middle">Disconnect preamps ×2</text>
<text x="260.0" y="350.0" font-size="11" text-anchor="middle">|vd| &gt; 560 mV ref (DDA)</text>
<rect x="420" y="300" width="150" height="70" rx="6" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="495.0" y="335.0" font-size="13.5" font-weight="bold" text-anchor="middle">2 comparators</text>
<text x="495.0" y="350.0" font-size="11" text-anchor="middle">OR</text>
<rect x="620" y="300" width="150" height="70" rx="6" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="695.0" y="335.0" font-size="13.5" font-weight="bold" text-anchor="middle">Timer</text>
<text x="695.0" y="350.0" font-size="11" text-anchor="middle">4 ns, fall at once</text>
<rect x="420" y="395" width="150" height="75" rx="6" fill="#fff" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="495.0" y="426.5" font-size="13.5" font-weight="bold" text-anchor="middle">Bias, refs</text>
<text x="495.0" y="441.5" font-size="11" text-anchor="middle">I0 = V(RX_VREF) / 60 kΩ</text>
<text x="495.0" y="454.5" font-size="11" text-anchor="middle">poly string → thresholds</text>
<rect x="620" y="395" width="150" height="75" rx="6" fill="#fff" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="695.0" y="426.5" font-size="13.5" font-weight="bold" text-anchor="middle">Enable / UVLO</text>
<text x="695.0" y="441.5" font-size="11" text-anchor="middle">ready ≈ 170 ns,</text>
<text x="695.0" y="454.5" font-size="11" text-anchor="middle">RX_VDD &gt; 2.95 V</text>
