<text x="200" y="320" font-size="12" font-weight="normal" text-anchor="start" fill="#222">The rising CLK_RX edge k samples bit k of CDR_DATA (data sample) and puts it on HS_RXD after t_cq; the digital</text>
<text x="200" y="338" font-size="12" font-weight="normal" text-anchor="start" fill="#222">(usb_afe_rx_if) captures HS_RXD with the next rising CLK_RX edge: one CLK_RX cycle of latency.</text></svg>