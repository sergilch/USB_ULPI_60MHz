<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="340" fill="white"/><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#222"/></marker></defs>
<text x="140" y="30" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Clock early (edge sample = previous bit) → DN</text>
<polyline points="150.0,100.0 324.0,100.0 336.0,70.0 534.0,70.0" fill="none" stroke="#1f4e9c" stroke-width="2"/>
<text x="198.0" y="92" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">D(k−1) = 0</text>
<text x="480.0" y="92" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">D(k) = 1</text>
<polyline points="150.0,180.0 150.0,150.0 180.0,150.0 180.0,180.0 240.0,180.0 240.0,150.0 300.0,150.0 300.0,180.0 360.0,180.0 360.0,150.0 420.0,150.0 420.0,180.0 480.0,180.0 480.0,150.0 534.0,150.0 534.0,180.0 534.0,180.0 534.0,150.0 534.0,150.0 534.0,180.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
<line x1="240.0" y1="55" x2="240.0" y2="200" stroke="#1f4e9c" stroke-dasharray="4,3"/>
<text x="240.0" y="218" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f4e9c">data k−1</text>
<line x1="300.0" y1="55" x2="300.0" y2="200" stroke="#c0392b" stroke-dasharray="4,3"/>
<text x="300.0" y="218" font-size="11" font-weight="normal" text-anchor="middle" fill="#c0392b">edge</text>
<line x1="360.0" y1="55" x2="360.0" y2="200" stroke="#1f4e9c" stroke-dasharray="4,3"/>
<text x="360.0" y="218" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f4e9c">data k</text>
<text x="342.0" y="245" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">edge sample = 0 = D(k−1)</text>
<text x="342.0" y="266" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#c0392b">DN: slower for one bit</text>
<text x="590" y="30" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Clock late (edge sample = new bit) → UP</text>
<polyline points="600.0,100.0 774.0,100.0 786.0,70.0 984.0,70.0" fill="none" stroke="#1f4e9c" stroke-width="2"/>
<text x="648.0" y="92" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">D(k−1) = 0</text>
<text x="930.0" y="92" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">D(k) = 1</text>
<polyline points="630.0,180.0 630.0,150.0 690.0,150.0 690.0,180.0 750.0,180.0 750.0,150.0 810.0,150.0 810.0,180.0 870.0,180.0 870.0,150.0 930.0,150.0 930.0,180.0 984.0,180.0 984.0,150.0 984.0,150.0 984.0,180.0 984.0,180.0 984.0,150.0 984.0,150.0 984.0,180.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
<line x1="750.0" y1="55" x2="750.0" y2="200" stroke="#1f4e9c" stroke-dasharray="4,3"/>
<text x="750.0" y="218" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f4e9c">data k−1</text>
<line x1="810.0" y1="55" x2="810.0" y2="200" stroke="#c0392b" stroke-dasharray="4,3"/>
<text x="810.0" y="218" font-size="11" font-weight="normal" text-anchor="middle" fill="#c0392b">edge</text>
<line x1="870.0" y1="55" x2="870.0" y2="200" stroke="#1f4e9c" stroke-dasharray="4,3"/>
<text x="870.0" y="218" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f4e9c">data k</text>
<text x="792.0" y="245" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">edge sample = 1 = D(k)</text>
<text x="792.0" y="266" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2e8b57">UP: faster for one bit</text>
<text x="140" y="100" font-size="12.5" font-weight="bold" text-anchor="end" fill="#222">CDR_DATA</text>
<text x="140" y="180" font-size="12.5" font-weight="bold" text-anchor="end" fill="#222">CLK_RX</text>
<text x="140" y="300" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Decision at the rising edge k:  UP = D(k−1) ⊕ E(k),  DN = D(k) ⊕ E(k);  no transition (D(k) = D(k−1)): no pump.</text>
<text x="140" y="320" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Transistor PD: FFA (↑) data, FFB (↓) edge, FFC / FFD retime; UP = qc ⊕ qd, DN = qa ⊕ qd (cdr_schematic.md 2.2).</text></svg>