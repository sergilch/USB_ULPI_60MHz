<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1100 470" role="img" aria-label="Block diagram: the external 24 MHz crystal with C1 and C2 on the XI and XO pads, the on-chip Pierce amplifier with RF, the amplitude regulation and bias, and the squarer that drives REF_CLK into the PLL reference input CDR_FREF" class="sch" style="background:#fff;color:#17221f" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="IBM Plex Mono, ui-monospace, monospace"><style>
