<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1160 650" role="img" aria-label="Supervisor: LDO_EN input MI with long-PMOS load and two inverters; bandgap-running detector MG; UVLO divider RUA, RUB, RUC with tap switches and comparator XCU; on = en_in and uv_ok; power-good taps pr, pf with comparator XCP; 10 us and 100 us delays (current-charged capacitor, Schmitt trigger) and the VOUT-supplied output inverters" class="sch" style="background:#fff;color:#17221f" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="IBM Plex Mono, ui-monospace, monospace"><style>
