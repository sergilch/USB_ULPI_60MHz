<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1180 510" role="img" aria-label="Block diagram of afe_ref_tr: dp3 bandgap with a 16-tap PTAT string, 4-bit trim mux and ripple filter, gain stage A1 (x1.0113) to vrt = 1.200 V, two unity buffers for TX_VREF and RX_VREF, and the current loop A_I with source follower MNF that holds the external RBIAS at vrt; a 20:1 cascode mirror gives TX_I_5U; enable and trim inputs" class="sch" style="background:#fff;color:#17221f" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="IBM Plex Mono, ui-monospace, monospace"><style>
.lb{font-size:12px;fill:currentColor} .dev{font-size:11.5px;font-weight:600;fill:currentColor}
.sz{font-size:10.5px;fill:currentColor;opacity:.72} .pin{font-size:12px;font-weight:600;fill:currentColor}
.rail{font-size:10.5px;fill:currentColor;opacity:.8} .bx{font-size:12.5px;font-weight:600;fill:currentColor}
.ar{font-size:11px;fill:currentColor;font-style:italic} text{stroke:none}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent, #0f7c80)" stroke="none"/></marker></defs><circle cx="10" cy="50" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="6" y="41" text-anchor="start" class="pin">VDD33</text><polyline points="14,50 1040,50" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="10" cy="485" r="3.5" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.6"/><text x="18" y="489" text-anchor="start" class="pin">GND</text><rect x="40" y="110" width="170" height="80" rx="3" fill="var(--panel, none)" stroke="var(--accent, #0f7c80)" stroke-width="1.8"/><text x="125.0" y="150.0" text-anchor="middle" class="bx">Bandgap</text><text x="125.0" y="165.0" text-anchor="middle" class="sz">dp3, 5 µA PTAT units</text><polyline points="125,50 125,110" fill="none"/><rect x="250" y="110" width="150" height="80" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="325.0" y="150.0" text-anchor="middle" class="bx">PTAT string</text><text x="325.0" y="165.0" text-anchor="middle" class="sz">16 taps, 0.6 % / step</text><polyline points="210,150 250,150" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><rect x="440" y="110" width="120" height="80" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="500.0" y="150.0" text-anchor="middle" class="bx">Trim mux</text><text x="500.0" y="165.0" text-anchor="middle" class="sz">16:1 NMOS tree</text><polyline points="400,150 440,150" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><text x="420" y="142" text-anchor="middle" class="sz">t0…t15</text><polyline points="560,150 600,150" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="600" cy="150" r="2.6" fill="currentColor" stroke="none"/><text x="600" y="140" text-anchor="middle" class="sz">vtap</text><polyline points="600,150 600,181.0" fill="none"/><polyline points="588,181.0 612,181.0" fill="none"/><polyline points="588,189.0 612,189.0" fill="none"/><polyline points="600,189.0 600,220" fill="none"/><text x="582" y="183.0" text-anchor="end" class="dev">CFL</text><text x="582" y="196.0" text-anchor="end" class="sz">6 pF</text><polyline points="590,220 610,220" fill="none"/><polyline points="594,224 606,224" fill="none"/><polyline points="598,228 602,228" fill="none"/><polygon points="640,130 640,198 700,164" fill="var(--panel, none)" stroke="var(--accent, #0f7c80)" stroke-width="1.8"/><text x="647" y="154" text-anchor="start" class="lb">+</text><text x="647" y="182" text-anchor="start" class="lb">−</text><text x="666" y="124" text-anchor="middle" class="dev">A1</text><text x="666" y="216" text-anchor="middle" class="sz">×1.0113</text><polyline points="600,150 640,150" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><polyline points="700,164 760,164" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="760" cy="164" r="2.6" fill="currentColor" stroke="none"/><text x="760" y="154" text-anchor="middle" class="sz">vrt 1.200 V</text><polyline points="640,178 630,178 630,250 740,250 740,164" fill="none"/><text x="690" y="244" text-anchor="middle" class="ar">RF / RG</text><polyline points="760,164 800,164 800,100 840,100" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><rect x="840" y="75" width="120" height="50" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="900.0" y="100.0" text-anchor="middle" class="bx">B_TX</text><text x="900.0" y="115.0" text-anchor="middle" class="sz">unity, 30 µA</text><polyline points="960,100 1040,100" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="1044" cy="100" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="1052" y="104" text-anchor="start" class="pin">TX_VREF</text><polyline points="800,164 800,210 840,210" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><rect x="840" y="185" width="120" height="50" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="900.0" y="210.0" text-anchor="middle" class="bx">B_RX</text><text x="900.0" y="225.0" text-anchor="middle" class="sz">unity, 30 µA</text><polyline points="960,210 1040,210" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="1044" cy="210" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="1052" y="214" text-anchor="start" class="pin">RX_VREF</text><polyline points="760,164 760,270 555,270 555,300" fill="none"/><rect x="470" y="300" width="170" height="60" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="555.0" y="330.0" text-anchor="middle" class="bx">A_I + MNF</text><text x="555.0" y="345.0" text-anchor="middle" class="sz">V(RBIAS) = vrt</text><polyline points="555,360 555,385" fill="none"/><circle cx="555" cy="389" r="3.5" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.6"/><text x="563" y="393" text-anchor="start" class="pin">RBIAS 12 kΩ</text><rect x="700" y="300" width="160" height="60" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="780.0" y="330.0" text-anchor="middle" class="bx">Cascode mirror</text><text x="780.0" y="345.0" text-anchor="middle" class="sz">20 : 1</text><polyline points="640,330 700,330" fill="none"/><text x="670" y="322" text-anchor="middle" class="sz">I</text><polyline points="770,290 790,290" fill="none"/><text x="780" y="285" text-anchor="middle" class="rail">VDD33</text><polyline points="780,290 780,300" fill="none"/><polyline points="860,330 1040,330" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="1044" cy="330" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="1052" y="334" text-anchor="start" class="pin">TX_I_5U</text><text x="950" y="322" text-anchor="middle" class="ar">VREF / RBIAS / 20 = 5 µA</text><rect x="110" y="290" width="170" height="70" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="195.0" y="325.0" text-anchor="middle" class="bx">Enable + trim inputs</text><text x="195.0" y="340.0" text-anchor="middle" class="sz">threshold ≈ 0.8 V</text><circle cx="14" cy="310" r="3.5" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.6"/><text x="10" y="301" text-anchor="start" class="pin">BIAS_EN</text><polyline points="18,310 110,310" fill="none"/><circle cx="14" cy="345" r="3.5" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.6"/><text x="10" y="336" text-anchor="start" class="pin">TRIM[3:0]</text><polyline points="18,345 110,345" fill="none"/><polyline points="280,325 300,325 300,190" fill="none" stroke-dasharray="4 3"/><polyline points="300,325 500,325 500,190" fill="none" stroke-dasharray="4 3"/><text x="306" y="320" text-anchor="start" class="ar">en_in, tk / tnk</text><polyline points="195,290 195,190" fill="none" stroke-dasharray="4 3"/><text x="40" y="440" text-anchor="start" class="ar">BIAS_EN = 0: bandgap, amplifiers and mirror off (&lt; 50 nA); TX_VREF = RX_VREF = 0 V, TX_I_5U = 0.</text><text x="40" y="460" text-anchor="start" class="ar">TRIM 1000b = nominal; every code step adds 0.6 % (PTAT gain), range −4.8 … +4.2 %.</text></svg>